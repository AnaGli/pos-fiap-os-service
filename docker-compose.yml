services:
  migrate:
    build: .
    command: sh -c "alembic upgrade head"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/os_service
      RABBITMQ_URL: amqp://guest:guest@rabbitmq-local:5672/
      DD_SERVICE: os-service-migrate
      DD_ENV: ${DD_ENV:-dev}
      DD_VERSION: ${DD_VERSION:-1.0.0}
      DD_TRACE_ENABLED: "true"
      DD_LOGS_INJECTION: "true"
      DD_AGENT_HOST: dd-agent
      DD_PSYCOPG_SERVICE: os-service-db
      DD_TAGS: component:migrate
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
      dd-agent:
        condition: service_started

  api:
    build: .
    command: ddtrace-run uvicorn app.main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/os_service
      RABBITMQ_URL: amqp://guest:guest@rabbitmq-local:5672/
      DD_SERVICE: os-service
      DD_ENV: ${DD_ENV:-dev}
      DD_VERSION: ${DD_VERSION:-1.0.0}
      DD_TRACE_ENABLED: "true"
      DD_LOGS_INJECTION: "true"
      DD_AGENT_HOST: dd-agent
      DD_PSYCOPG_SERVICE: os-service-db
      DD_TAGS: component:api
    networks:
      - internal
      - workshop-net
    depends_on:
      migrate:
        condition: service_completed_successfully
      dd-agent:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')\""]
      interval: 30s
      timeout: 5s
      retries: 10

  publisher:
    build: .
    command: ddtrace-run python -m app.messaging.outbox_publisher
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/os_service
      RABBITMQ_URL: amqp://guest:guest@rabbitmq-local:5672/
      DD_SERVICE: os-service-publisher
      DD_ENV: ${DD_ENV:-dev}
      DD_VERSION: ${DD_VERSION:-1.0.0}
      DD_TRACE_ENABLED: "true"
      DD_LOGS_INJECTION: "true"
      DD_AGENT_HOST: dd-agent
      DD_PSYCOPG_SERVICE: os-service-db
      DD_TAGS: component:publisher
    networks:
      - internal
      - workshop-net
    depends_on:
      migrate:
        condition: service_completed_successfully
      dd-agent:
        condition: service_started

  consumer:
    build: .
    command: ddtrace-run python -m app.messaging.consumer
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/os_service
      RABBITMQ_URL: amqp://guest:guest@rabbitmq-local:5672/
      DD_SERVICE: os-service-consumer
      DD_ENV: ${DD_ENV:-dev}
      DD_VERSION: ${DD_VERSION:-1.0.0}
      DD_TRACE_ENABLED: "true"
      DD_LOGS_INJECTION: "true"
      DD_AGENT_HOST: dd-agent
      DD_PSYCOPG_SERVICE: os-service-db
      DD_TAGS: component:consumer
    networks:
      - internal
      - workshop-net
    depends_on:
      migrate:
        condition: service_completed_successfully
      dd-agent:
        condition: service_started

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: os_service
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d os_service"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  dd-agent:
    image: datadog/agent:7
    environment:
      DD_API_KEY: ${DD_API_KEY}
      DD_SITE: ${DD_SITE:-datadoghq.com}
      DD_ENV: ${DD_ENV:-dev}
      DD_LOG_LEVEL: WARN
      DD_APM_ENABLED: "true"
      DD_APM_NON_LOCAL_TRAFFIC: "true"
      DD_DOGSTATSD_NON_LOCAL_TRAFFIC: "true"
      DD_LOGS_ENABLED: "true"
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - internal
      - workshop-net

networks:
  internal:
  workshop-net:
    external: true
